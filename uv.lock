sdist = { url = "https://files.pythonhosted.org/packages/source/m/mypy/mypy-1.20.2.tar.gz" }
dependencies = [
    { name = "librt", marker = "platform_python_implementation != 'PyPy'" },
    { name = "mypy-extensions" },
