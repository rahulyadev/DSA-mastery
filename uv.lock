version = 1
revision = 3
requires-python = ">=3.11, <3.15"

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/c/colorama/colorama-0.4.6.tar.gz" }

[[package]]
name = "coverage"
version = "7.13.3"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/c/coverage/coverage-7.13.3.tar.gz" }

[[package]]
name = "hypothesis"
version = "6.165.2"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/h/hypothesis/hypothesis-6.165.2.tar.gz" }
dependencies = [
    { name = "sortedcontainers" },
]

[[package]]
