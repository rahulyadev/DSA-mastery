version = "2.20.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/p/pygments/pygments-2.20.0.tar.gz" }

[[package]]
name = "pytest"
version = "8.4.2"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/p/pytest/pytest-8.4.2.tar.gz" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
    { name = "packaging" },
    { name = "pluggy" },
    { name = "pygments" },
]

[[package]]
name = "pytest-cov"
version = "7.1.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/p/pytest-cov/pytest_cov-7.1.0.tar.gz" }
dependencies = [
    { name = "coverage" },
    { name = "pluggy" },
    { name = "pytest" },
]

[[package]]
name = "ruff"
version = "0.16.1"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/r/ruff/ruff-0.16.1.tar.gz" }

[[package]]
name = "dsa-mastery"
version = "0.1.0"
source = { virtual = "." }

[package.dev-dependencies]
dev = [
    { name = "hypothesis" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dev = { dev = [
    { name = "hypothesis", specifier = ">=6.0" },
    { name = "mypy", specifier = ">=1.0" },
    { name = "pytest", specifier = ">=8.0" },
    { name = "pytest-cov", specifier = ">=5.0" },
    { name = "ruff", specifier = ">=0.9" },
] }

