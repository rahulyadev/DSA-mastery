[[package]]
name = "pluggy"
version = "1.6.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/source/p/pluggy/pluggy-1.6.0.tar.gz" }

[[package]]
